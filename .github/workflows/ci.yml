name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      # Solo el server usa BD; el agent lo ignora. La BD debe terminar en _test (los tests la vacian).
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: argos_test
          POSTGRES_PASSWORD: argos_test
          POSTGRES_DB: argos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argos_test -d argos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGOS_TEST_DATABASE_URL: ${{ matrix.module == 'server' && 'postgres://argos_test:argos_test@localhost:5432/argos_test?sslmode=disable' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}
      - name: govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && "$(go env GOPATH)/bin/govulncheck" ./...
      - name: go test
        run: go test -race -count=1 ./...

  # Los tests que dependen de la hora local (fechas "de hoy", truncar a dia, DateOnly) fallan de noche o en otro huso
  # sin que nadie lo note (pasó con "fecha futura" en UTC-5). Correr la suite con los dos husos extremos (UTC+14 y
  # UTC-12) lo destapa de una vez: cualquier huso queda entre esos dos. Sin -race (eso ya lo cubre el job go).
  go-tz:
    name: go (${{ matrix.module }}, huso ${{ matrix.tz }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module: [server, agent]
        tz: [Pacific/Kiritimati, Etc/GMT+12]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: argos_test
          POSTGRES_PASSWORD: argos_test
          POSTGRES_DB: argos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argos_test -d argos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARGOS_TEST_DATABASE_URL: ${{ matrix.module == 'server' && 'postgres://argos_test:argos_test@localhost:5432/argos_test?sslmode=disable' || '' }}
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: go test (huso ${{ matrix.tz }})
        run: go test -count=1 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
